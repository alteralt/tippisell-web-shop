name: Lint
on:
    push:
        branches: "*"
    pull_request:
        branches: [main]
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install modules
              run: npm ci
            - name: ESLint
              run: npm run lint
            - name: Prettier
              run: npm run lint:prettier
